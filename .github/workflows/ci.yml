name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: test
      JWT_SECRET: "ci-test-secret-not-for-production"
      JWT_ISSUER: "ai-qa-api"
      JWT_AUDIENCE: "ai-qa-api-clients"
      LLM_API_KEY: "test-key"
      LLM_BASE_URL: "http://test.invalid/v1"
      LLM_MODEL: "test-model"
      LLM_FALLBACK_MODEL: "test-fallback"
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/15"
      ADMIN_PASSWORD: "admin123"
      DEMO_USER_PASSWORD: "user123"
      DEMO_READONLY_PASSWORD: "read123"
      METRICS_TOKEN: "test-scrape-token"
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t ai-qa-api:ci .

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate manifests
        run: |
          kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml
          kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml
          echo "rendered $(grep -c '^kind:' /tmp/prod.yaml) prod objects"
