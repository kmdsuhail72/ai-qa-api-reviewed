events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        least_conn;
        server api1:8000 max_fails=3 fail_timeout=30s;
        server api2:8000 max_fails=3 fail_timeout=30s;
        server api3:8000 max_fails=3 fail_timeout=30s;
    }

    # Coarse per-IP protection in front of the app's per-user Redis limiter
    limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;

    server {
        listen 8080;
        limit_req zone=perip burst=100 nodelay;
        limit_req_status 429;
        add_header X-Upstream $upstream_addr always;
        server_name _;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # retry idempotent requests on another replica if one is down
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
