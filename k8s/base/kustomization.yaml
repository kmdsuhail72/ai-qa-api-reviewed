apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-qa-api

commonLabels:
  app.kubernetes.io/part-of: ai-qa-api
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

images:
  - name: ghcr.io/your-org/ai-qa-api
    newTag: "0.2.0"
