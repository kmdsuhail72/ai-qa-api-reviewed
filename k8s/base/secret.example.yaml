# DO NOT COMMIT REAL VALUES.
# This file documents the shape of the Secret the Deployment expects.
# Create the real Secret out of band:
#
#   kubectl -n ai-qa-api create secret generic ai-qa-api-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LLM_API_KEY="sk-..." \
#     --from-literal=POSTGRES_PASSWORD="..." \
#     --from-literal=DATABASE_URL="postgresql+psycopg2://appuser:...@postgres.ai-qa-api.svc.cluster.local:5432/appdb" \
#     --from-literal=ADMIN_PASSWORD="..." \
#     --from-literal=METRICS_TOKEN="$(openssl rand -hex 24)"
#
apiVersion: v1
kind: Secret
metadata:
  name: ai-qa-api-secrets
  namespace: ai-qa-api
  labels:
    app.kubernetes.io/name: ai-qa-api
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  JWT_ALGORITHM: "HS256"
  JWT_ISSUER: "ai-qa-api"
  JWT_AUDIENCE: "ai-qa-api-clients"
  JWT_EXPIRE_MINUTES: "60"

  LLM_API_KEY: "REPLACE_ME"

  POSTGRES_USER: "appuser"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "appdb"
  DATABASE_URL: "postgresql+psycopg2://appuser:REPLACE_ME@postgres.ai-qa-api.svc.cluster.local:5432/appdb"

  ADMIN_USERNAME: "admin"
  # Bootstrap admin is created on first start only if this is set.
  ADMIN_PASSWORD: "REPLACE_ME"
  ADMIN_EMAIL: "admin@example.com"

  METRICS_TOKEN: "REPLACE_ME"
