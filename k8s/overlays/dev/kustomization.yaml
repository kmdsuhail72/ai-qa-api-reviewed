apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-qa-api

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: ai-qa-api
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: ai-qa-api

images:
  - name: ghcr.io/your-org/ai-qa-api
    newName: ai-qa-api
    newTag: local
